<title>科学计算器 · 工具箱</title>
<!--
  ============================================================================
  科学计算器（工具箱第三件工具）
  - 单文件、零外部依赖（无 CDN / 无字体 / 无图片 / 无网络请求），双击即可离线运行
  - 解析内核：自写 tokenizer + 调度场（shunting-yard）转 RPN 再求值
              严禁 eval / new Function / 任何动态代码执行
  - 运算符优先级（低→高）：
      + -  →  * /  →  一元负号  →  ^（右结合）  →  后缀 ! %  →  函数 / 括号
  - 精度：四舍五入到 12 位有效数字；极大/极小走科学计数法
  - 视觉与 index.html / calendar.html / tools/loan.html 同源
              （浅蓝白粉 · 玻璃拟态 · 系统字体栈）
  ============================================================================
-->
<style>
  /* ===================== 设计变量（浅色 蓝白粉，与其他页面同源） ===================== */
  :root{
    color-scheme:light;
    --blue:#3b82f6;
    --blue-d:#2563eb;
    --blue-dd:#1d4ed8;
    --blue-bg:#eff6ff;
    --pink:#ec4899;
    --pink-d:#db2777;
    --pink-bg:#fdf2f8;
    --text:#1e293b;
    --text-dim:#475569;
    --text-mute:#64748b;
    --border:rgba(255,255,255,.9);
    --line:rgba(148,163,184,.28);
    --radius:20px;
    --ease:cubic-bezier(.2,.7,.3,1);
    --err:#dc2626;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  [hidden]{display:none !important;}
  body{
    margin:0;
    min-height:100vh;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
                "Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",
                "Noto Sans CJK SC",sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    background:
      radial-gradient(1100px 780px at 8% -10%, rgba(147,197,253,.55), transparent 62%),
      radial-gradient(900px 640px at 100% 0%, rgba(249,168,212,.45), transparent 58%),
      radial-gradient(900px 900px at 50% 122%, rgba(191,219,254,.45), transparent 64%),
      linear-gradient(160deg,#f7fbff 0%,#eef5ff 46%,#fdf2f8 100%);
    background-attachment:fixed;
  }

  /* 纯 CSS 氛围光斑（与其他页面一致） */
  .aura{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .aura::before,.aura::after{
    content:"";position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;
    animation:float 26s ease-in-out infinite;
  }
  .aura::before{width:540px;height:540px;left:-160px;top:-180px;
    background:radial-gradient(circle,rgba(147,197,253,.55),transparent 70%);}
  .aura::after{width:480px;height:480px;right:-160px;top:22%;animation-delay:-12s;
    background:radial-gradient(circle,rgba(249,168,212,.42),transparent 70%);}
  @keyframes float{
    0%,100%{transform:translate3d(0,0,0) scale(1);}
    50%{transform:translate3d(0,34px,0) scale(1.08);}
  }

  /* ===================== 布局 ===================== */
  .app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:20px 18px 64px;}

  .card{
    border-radius:var(--radius);
    background:linear-gradient(180deg,rgba(255,255,255,.80),rgba(255,255,255,.66));
    border:1px solid var(--border);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 8px 32px rgba(59,130,246,.10), inset 0 1px 0 rgba(255,255,255,.9);
  }

  /* 返回工具箱 */
  .back{
    display:inline-flex;align-items:center;gap:6px;
    margin-bottom:14px;padding:8px 14px;border-radius:12px;
    font-size:13.5px;font-weight:700;text-decoration:none;
    color:var(--blue-dd);background:rgba(255,255,255,.72);
    border:1px solid rgba(59,130,246,.24);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transition:transform .18s var(--ease),box-shadow .24s var(--ease),background .24s var(--ease);
  }
  .back:hover{transform:translateX(-2px);background:#fff;box-shadow:0 6px 18px rgba(59,130,246,.16);}
  .back:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(59,130,246,.28);}

  .title-bar{padding:20px 20px 18px;margin-bottom:18px;text-align:center;}
  .page-title{
    margin:0;line-height:1.15;
    font-size:clamp(24px,5.4vw,36px);font-weight:800;letter-spacing:.06em;
    background:linear-gradient(94deg,#1d4ed8,#3b82f6 42%,#a855f7 74%,#ec4899);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .page-sub{margin:10px 0 0;font-size:13px;color:var(--text-mute);letter-spacing:.06em;}

  /* 左：计算器主体 / 右：历史与辅助 */
  .layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,336px);gap:18px;align-items:start;}
  .col-right{display:flex;flex-direction:column;gap:18px;min-width:0;}
  .col-right>.card{padding:18px;min-width:0;}
  .col-left{min-width:0;display:flex;flex-direction:column;gap:18px;}
  .col-left>.card{padding:18px;min-width:0;}

  .sec-title{
    font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--text-mute);
    text-transform:uppercase;margin:0 0 12px;
  }

  /* ===================== 显示区 ===================== */
  .display{
    display:flex;flex-direction:column;gap:8px;
    padding:16px 18px;border-radius:16px;
    background:linear-gradient(180deg,#ffffff,#f6faff);
    border:1px solid rgba(148,163,184,.30);
    box-shadow:inset 0 2px 10px rgba(59,130,246,.06);
    overflow:hidden;
  }
  .expr-line{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:clamp(19px,4.4vw,26px);font-weight:700;color:var(--text);
    min-height:1.5em;line-height:1.5;letter-spacing:.02em;
    word-break:break-all;overflow-wrap:anywhere;
    font-variant-numeric:tabular-nums;
  }
  .expr-line .caret{
    display:inline-block;width:2px;height:1.05em;margin:0 1px -0.14em;
    background:var(--blue);border-radius:1px;
    animation:blink 1.1s steps(1,end) infinite;
  }
  @keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:0;}}
  .expr-line.empty{color:var(--text-mute);}
  .preview-line{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:15px;color:var(--text-mute);min-height:1.4em;line-height:1.4;
    letter-spacing:.02em;word-break:break-all;overflow-wrap:anywhere;
    font-variant-numeric:tabular-nums;
  }
  .preview-line.err{color:var(--err);font-weight:700;}
  .status-bar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin-top:2px;padding-top:8px;border-top:1px dashed var(--line);
    font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--text-mute);
  }
  .badge{
    display:inline-flex;align-items:center;justify-content:center;
    padding:2px 9px;border-radius:99px;font-size:11px;font-weight:800;
    background:var(--blue-bg);color:var(--blue-dd);
    border:1px solid rgba(59,130,246,.26);
  }
  .badge.mem{background:var(--pink-bg);color:var(--pink-d);border-color:rgba(236,72,153,.30);}
  .badge.ghost{background:transparent;color:var(--text-mute);border-color:var(--line);}
  .status-spacer{margin-left:auto;}
  .status-val{
    font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;
    letter-spacing:.02em;color:var(--text-dim);
  }

  /* ===================== 按键区 ===================== */
  .pads{display:flex;flex-direction:column;gap:10px;}
  .pad-group{display:flex;flex-direction:column;gap:6px;}
  .pad-label{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--text-mute);}
  .pad{
    display:grid;gap:8px;
    grid-template-columns:repeat(5,1fr);
  }
  .key{
    appearance:none;font:inherit;cursor:pointer;user-select:none;
    display:flex;align-items:center;justify-content:center;
    min-width:0;min-height:44px;padding:6px 2px;border-radius:12px;
    font-size:15px;font-weight:700;line-height:1.1;
    color:var(--text-dim);background:#fff;
    border:1px solid rgba(148,163,184,.34);
    box-shadow:0 1px 2px rgba(15,23,42,.04);
    transition:transform .12s var(--ease),box-shadow .18s var(--ease),
               background .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease);
    word-break:keep-all;
  }
  .key:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(59,130,246,.16);border-color:rgba(59,130,246,.42);}
  .key:active{transform:translateY(0);background:var(--blue-bg);}
  .key:focus-visible{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.28);}
  .key.fn{color:var(--blue-dd);background:#f5f9ff;border-color:rgba(59,130,246,.24);font-size:13.5px;}
  .key.num{font-size:17px;font-weight:800;color:var(--text);}
  .key.op{color:var(--pink-d);background:var(--pink-bg);border-color:rgba(236,72,153,.26);font-size:16px;}
  .key.eq{
    color:#fff;border-color:transparent;
    background:linear-gradient(140deg,#60a5fa,#3b82f6 55%,#db2777);
    box-shadow:0 6px 16px rgba(59,130,246,.28);
  }
  .key.eq:hover{box-shadow:0 10px 22px rgba(59,130,246,.34);}
  .key.danger{color:var(--err);background:#fff5f5;border-color:rgba(220,38,38,.26);}
  .key.span2{grid-column:span 2;}
  .key.sm{font-size:12.5px;}

  /* ===================== 右栏：历史 ===================== */
  .hist-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .hist-head .sec-title{margin:0;}
  .hist-list{
    display:flex;flex-direction:column;gap:8px;
    max-height:340px;overflow:auto;min-width:0;
    padding-right:2px;
  }
  .hist-empty{font-size:12.5px;color:var(--text-mute);text-align:center;padding:18px 6px;line-height:1.8;}
  .hist-item{
    display:flex;flex-direction:column;gap:3px;align-items:stretch;
    padding:9px 11px;border-radius:12px;background:#fff;
    border:1px solid rgba(148,163,184,.24);
    transition:border-color .18s var(--ease),box-shadow .18s var(--ease),transform .18s var(--ease);
  }
  .hist-item:hover{border-color:rgba(59,130,246,.4);box-shadow:0 6px 14px rgba(59,130,246,.12);}
  .hist-expr{
    appearance:none;border:0;background:transparent;padding:0;margin:0;
    font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
    color:var(--text-mute);text-align:left;cursor:pointer;word-break:break-all;
    overflow-wrap:anywhere;
  }
  .hist-res{
    appearance:none;border:0;background:transparent;padding:0;margin:0;
    font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;
    font-weight:800;color:var(--blue-dd);text-align:left;cursor:pointer;
    word-break:break-all;overflow-wrap:anywhere;
  }
  .hist-expr:hover,.hist-res:hover{text-decoration:underline;}
  .hist-expr:focus-visible,.hist-res:focus-visible{outline:none;box-shadow:0 0 0 2px rgba(59,130,246,.35);border-radius:4px;}

  /* ===================== 右栏：记忆 / 辅助 ===================== */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .mem-val{
    display:flex;align-items:baseline;gap:8px;
    padding:10px 12px;border-radius:12px;margin-bottom:10px;
    background:linear-gradient(180deg,#ffffff,#f7fbff);
    border:1px solid rgba(148,163,184,.28);
    min-width:0;
  }
  .mem-val .mlbl{font-size:11.5px;font-weight:700;color:var(--text-mute);letter-spacing:.08em;}
  .mem-val .mnum{
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;font-weight:800;
    color:var(--pink-d);word-break:break-all;overflow-wrap:anywhere;margin-left:auto;
  }
  .btn{
    appearance:none;cursor:pointer;font:inherit;font-size:13px;font-weight:700;
    padding:9px 12px;border-radius:12px;border:1px solid rgba(59,130,246,.28);
    color:var(--blue-dd);background:#fff;
    transition:transform .18s var(--ease),box-shadow .24s var(--ease),
               background .18s var(--ease),color .18s var(--ease);
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(59,130,246,.18);}
  .btn:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(59,130,246,.28);}
  .btn.block{width:100%;}
  .btn.slim{font-size:12.5px;padding:7px 10px;}
  .btn.warm{color:var(--pink-d);border-color:rgba(236,72,153,.30);}
  .seg{display:inline-flex;flex-wrap:wrap;gap:3px;padding:3px;border-radius:13px;
    background:#eef4ff;border:1px solid rgba(59,130,246,.20);}
  .seg button{
    appearance:none;border:0;cursor:pointer;font:inherit;font-size:12.5px;font-weight:700;
    color:var(--text-dim);background:transparent;padding:7px 12px;border-radius:10px;
    transition:background .18s var(--ease),color .18s var(--ease),box-shadow .18s var(--ease);
    white-space:nowrap;
  }
  .seg button[aria-pressed="true"]{background:#fff;color:var(--blue-dd);box-shadow:0 2px 8px rgba(59,130,246,.18);}
  .seg button:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(59,130,246,.28);}
  .hint{font-size:11.5px;color:var(--text-mute);line-height:1.7;margin:10px 0 0;}
  .hint code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;
    padding:1px 5px;border-radius:6px;color:var(--blue-dd);background:var(--blue-bg);}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
    z-index:50;padding:9px 18px;border-radius:99px;font-size:12.5px;font-weight:700;
    color:#fff;background:rgba(30,41,59,.92);
    box-shadow:0 10px 26px rgba(15,23,42,.28);
    opacity:0;pointer-events:none;transition:opacity .24s var(--ease),transform .24s var(--ease);
    max-width:calc(100vw - 32px);text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .footnote{margin:22px 0 0;text-align:center;font-size:11.5px;color:var(--text-mute);letter-spacing:.04em;}

  /* ===================== 响应式 ===================== */
  @media (max-width:1023px){
    /* minmax(0,1fr)：轨道最小为 0，避免内容撑破 */
    .layout{grid-template-columns:minmax(0,1fr);}
    .hist-list{max-height:280px;}
  }
  @media (max-width:560px){
    .app{padding:16px 12px 48px;}
    .key{min-height:42px;font-size:14px;border-radius:11px;}
    .key.num{font-size:16px;}
    .key.fn{font-size:12.5px;}
    .grid2{grid-template-columns:1fr;}
  }
  @media (max-width:360px){
    .key{min-height:40px;font-size:13px;padding:4px 1px;}
    .key.num{font-size:15px;}
    .key.fn,.key.sm{font-size:11.5px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
  }
</style>
</head>
<body>
<div class="aura" aria-hidden="true"></div>
<div class="app">
  <a class="back" href="../index.html">‹ 返回工具箱</a>

  <header class="card title-bar">
    <h1 class="page-title">科学计算器</h1>
    <p class="page-sub">四则运算 · 三角函数 · 对数与幂运算 · 括号与历史记录</p>
  </header>

  <div class="layout">
    <!-- ===================== 左：计算器主体 ===================== -->
    <div class="col-left">
      <!-- ---------- 显示区 ---------- -->
      <section class="card" aria-label="显示区">
        <div class="display">
          <div class="expr-line empty" id="exprLine" aria-label="当前表达式" aria-live="polite"></div>
          <div class="preview-line" id="previewLine" aria-label="结果预览" aria-live="polite"></div>
          <div class="status-bar">
            <span class="badge" id="angleBadge">DEG</span>
            <span class="badge mem" id="memBadge" hidden>M</span>
            <span class="status-spacer"></span>
            <span class="badge ghost">12 位有效数字</span>
          </div>
        </div>
      </section>

      <!-- ---------- 按键区 ---------- -->
      <section class="card" aria-label="按键区">
        <p class="sec-title">按键</p>
        <div class="pads">
          <!-- 基础：数字 · 四则 · 括号 · 常量 -->
          <div class="pad-group">
            <div class="pad" id="padBasic" role="group" aria-label="数字与基础运算">
              <button type="button" class="key fn danger" data-act="clear" aria-label="全部清除">AC</button>
              <button type="button" class="key fn" data-act="del" aria-label="退格删除">DEL</button>
              <button type="button" class="key op" data-ins="(" aria-label="左括号">(</button>
              <button type="button" class="key op" data-ins=")" aria-label="右括号">)</button>
              <button type="button" class="key op" data-ins="/" aria-label="除">÷</button>

              <button type="button" class="key num" data-ins="7" aria-label="7">7</button>
              <button type="button" class="key num" data-ins="8" aria-label="8">8</button>
              <button type="button" class="key num" data-ins="9" aria-label="9">9</button>
              <button type="button" class="key fn" data-ins="%" aria-label="百分号（除以 100）">%</button>
              <button type="button" class="key op" data-ins="*" aria-label="乘">×</button>

              <button type="button" class="key num" data-ins="4" aria-label="4">4</button>
              <button type="button" class="key num" data-ins="5" aria-label="5">5</button>
              <button type="button" class="key num" data-ins="6" aria-label="6">6</button>
              <button type="button" class="key fn" data-ins="!" aria-label="阶乘">x!</button>
              <button type="button" class="key op" data-ins="-" aria-label="减">−</button>

              <button type="button" class="key num" data-ins="1" aria-label="1">1</button>
              <button type="button" class="key num" data-ins="2" aria-label="2">2</button>
              <button type="button" class="key num" data-ins="3" aria-label="3">3</button>
              <button type="button" class="key fn" data-act="negate" aria-label="正负号（插入负号）" title="插入负号 -">±</button>
              <button type="button" class="key op" data-ins="+" aria-label="加">+</button>

              <button type="button" class="key num" data-ins="0" aria-label="0">0</button>
              <button type="button" class="key num" data-ins="." aria-label="小数点">.</button>
              <button type="button" class="key fn" data-ins="π" aria-label="圆周率 π">π</button>
              <button type="button" class="key fn" data-ins="e" aria-label="自然常数 e">e</button>
              <button type="button" class="key eq" data-act="equals" aria-label="等于">=</button>
            </div>
          </div>

          <!-- 科学函数 -->
          <div class="pad-group">
            <div class="pad-label">科学函数</div>
            <div class="pad" id="padSci" role="group" aria-label="科学函数">
              <button type="button" class="key fn" data-ins="sin(" aria-label="正弦">sin</button>
              <button type="button" class="key fn" data-ins="cos(" aria-label="余弦">cos</button>
              <button type="button" class="key fn" data-ins="tan(" aria-label="正切">tan</button>
              <button type="button" class="key fn" data-ins="asin(" aria-label="反正弦">asin</button>
              <button type="button" class="key fn" data-ins="acos(" aria-label="反余弦">acos</button>

              <button type="button" class="key fn" data-ins="atan(" aria-label="反正切">atan</button>
              <button type="button" class="key fn" data-ins="ln(" aria-label="自然对数">ln</button>
              <button type="button" class="key fn" data-ins="log(" aria-label="常用对数（以 10 为底）">log</button>
              <button type="button" class="key fn" data-ins="e^(" aria-label="e 的 x 次幂">e^x</button>
              <button type="button" class="key fn" data-ins="10^(" aria-label="10 的 x 次幂">10^x</button>

              <button type="button" class="key fn" data-ins="sqrt(" aria-label="平方根">√</button>
              <button type="button" class="key fn" data-ins="^2" aria-label="平方">x²</button>
              <button type="button" class="key fn" data-ins="^" aria-label="幂运算">x^y</button>
              <button type="button" class="key fn" data-ins="abs(" aria-label="绝对值">|x|</button>
              <button type="button" class="key fn" data-ins="1/(" aria-label="倒数">1/x</button>
            </div>
          </div>

          <!-- 角度单位 -->
          <div class="pad-group">
            <div class="pad-label">角度单位</div>
            <div class="seg" id="angleSeg" role="group" aria-label="角度单位">
              <button type="button" data-angle="DEG" aria-pressed="true">DEG 度</button>
              <button type="button" data-angle="RAD" aria-pressed="false">RAD 弧度</button>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- ===================== 右：历史 · 记忆 · 设置 ===================== -->
    <div class="col-right">
      <section class="card" aria-label="历史记录">
        <div class="hist-head">
          <p class="sec-title">历史记录</p>
          <button type="button" class="btn slim" id="clearHist" aria-label="清空历史记录">清空历史</button>
        </div>
        <div class="hist-list" id="histList"></div>
      </section>

      <section class="card" aria-label="记忆与设置">
        <p class="sec-title">记忆</p>
        <div class="mem-val">
          <span class="mlbl">M =</span>
          <span class="mnum" id="memVal">0</span>
        </div>
        <div class="grid2">
          <button type="button" class="btn slim" data-mem="add" aria-label="记忆加：记忆值加上当前结果">M+</button>
          <button type="button" class="btn slim" data-mem="sub" aria-label="记忆减：记忆值减去当前结果">M−</button>
          <button type="button" class="btn slim warm" data-mem="recall" aria-label="读取记忆值到表达式">MR</button>
          <button type="button" class="btn slim" data-mem="clear" aria-label="清除记忆值">MC</button>
        </div>

        <p class="sec-title" style="margin-top:16px;">设置</p>
        <button type="button" class="btn block" id="copyRes" aria-label="复制当前结果">复制结果</button>
        <p class="hint">
          键盘可直接输入：<code>0-9</code> <code>. + - * / ( ) ^ ! %</code>；
          <code>Enter</code>/<code>=</code> 求值，<code>Backspace</code> 退格，<code>Esc</code> 全清。<br>
          <code>%</code> 为<b>后缀百分号</b>，等价于除以 100（<code>50%</code> = <code>0.5</code>、<code>100+10%</code> = <code>100.1</code>）。<br>
          结果为 12 位有效数字；极大或极小的数自动用科学计数法显示。
        </p>
      </section>
    </div>
  </div>

  <p class="footnote">本地离线运行 · 零外部依赖</p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* =====================================================================
     一、计算内核
     ---------------------------------------------------------------------
     1) tokenize      把 ASCII 中缀串切成 token（数字 / 运算符 / 函数 / 括号）
     2) toRPN         调度场算法（shunting-yard）转后缀（RPN）
     3) evalRPN       求值 RPN
     4) clean         精度与显示格式化（12 位有效数字）
     全程不使用 eval / new Function / 任何动态代码执行。
     ===================================================================== */

  /** 计算错误（携带逐字一致的中文文案）。 */
  function CalcError(message) { this.name = 'CalcError'; this.message = message; }
  CalcError.prototype = Object.create(Error.prototype);

  /* 分隔符表：二元运算符（p=优先级，a=结合性 L 左 / R 右）。
     优先级（低→高）：+ -  →  * /  →  一元负号  →  ^（右结合）  →  后缀 ! %  →  函数/括号 */
  var BIN = {
    '+': { p: 1, a: 'L' }, '-': { p: 1, a: 'L' },
    '*': { p: 2, a: 'L' }, '/': { p: 2, a: 'L' },
    '^': { p: 4, a: 'R' }
  };
  /* 函数名按长度倒序匹配，确保 exp( 不会被误判成常量 e */
  var FUNC_NAMES = ['asin', 'acos', 'atan', 'sqrt', 'sin', 'cos', 'tan', 'log', 'abs', 'exp', 'ln'];

  /** 运算符优先级（POSTFIX=5 > '^'=4 > 一元负号=3 > '*' '/'=2 > '+' '-'=1）。 */
  function opPrec(op) {
    if (op === 'u-') { return 3; }
    if (op === '!' || op === '%') { return 5; }
    return BIN[op] ? BIN[op].p : -1;
  }

  /** 判断当前位置的「-」「+」是否处于一元（前缀）上下文。 */
  function isUnaryContext(prev) {
    if (!prev) { return true; }
    if (prev.type === 'lp' || prev.type === 'func') { return true; }
    if (prev.type === 'op') {
      if (prev.op === '!' || prev.op === '%') { return false; } // 后缀运算符之后是二元位置
      return true;
    }
    return false; // 数字 / ')' 之后是二元位置
  }

  /** 词法分析：ASCII 中缀串 → token 数组。 */
  function tokenize(src) {
    var tokens = [];
    var i = 0;
    var n = src.length;
    while (i < n) {
      var ch = src.charAt(i);
      if (ch === ' ' || ch === '\t' || ch === '\n' || ch === '\r') { i++; continue; }

      /* --- 数字（含小数点） --- */
      if ((ch >= '0' && ch <= '9') || ch === '.') {
        var j = i;
        var dot = false;
        var buf = '';
        while (j < n) {
          var cj = src.charAt(j);
          if (cj >= '0' && cj <= '9') { buf += cj; j++; }
          else if (cj === '.') { if (dot) { break; } dot = true; buf += cj; j++; }
          else { break; }
        }
        var num = parseFloat(buf);
        if (!isFinite(num)) { throw new CalcError('错误：表达式格式有误'); }
        tokens.push({ type: 'num', value: num });
        i = j;
        continue;
      }

      /* --- 字母：函数名 / 常量 pi / 常量 e --- */
      if (/[a-zA-Z]/.test(ch)) {
        var matched = null;
        for (var f = 0; f < FUNC_NAMES.length; f++) {
          var fname = FUNC_NAMES[f];
          if (src.substr(i, fname.length).toLowerCase() === fname &&
              src.charAt(i + fname.length) === '(') { matched = fname; break; }
        }
        if (matched) { tokens.push({ type: 'func', name: matched }); i += matched.length; continue; }
        if (src.substr(i, 2).toLowerCase() === 'pi') { tokens.push({ type: 'num', value: Math.PI }); i += 2; continue; }
        if (ch === 'e') { tokens.push({ type: 'num', value: Math.E }); i++; continue; }
        throw new CalcError('错误：表达式格式有误');
      }

      /* --- 常量 π --- */
      if (ch === '\u03c0') { tokens.push({ type: 'num', value: Math.PI }); i++; continue; }

      /* --- 括号 --- */
      if (ch === '(') { tokens.push({ type: 'lp' }); i++; continue; }
      if (ch === ')') { tokens.push({ type: 'rp' }); i++; continue; }

      /* --- 运算符 --- */
      if (ch === '+' || ch === '-' || ch === '*' || ch === '/' || ch === '^' || ch === '!' || ch === '%') {
        var prev = tokens.length ? tokens[tokens.length - 1] : null;
        if (ch === '+') {
          if (isUnaryContext(prev)) { i++; continue; } // 一元正号：忽略
          tokens.push({ type: 'op', op: '+' });
        } else if (ch === '-') {
          tokens.push(isUnaryContext(prev) ? { type: 'op', op: 'u-' } : { type: 'op', op: '-' });
        } else if (ch === '!') {
          tokens.push({ type: 'op', op: '!' });
        } else if (ch === '%') {
          /* 后缀百分号：x% === x/100（唯一语义，不设二元取模） */
          tokens.push({ type: 'op', op: '%' });
        } else {
          tokens.push({ type: 'op', op: ch });
        }
        i++;
        continue;
      }

      throw new CalcError('错误：表达式格式有误');
    }
    return tokens;
  }

  /** 调度场算法：中缀 token 序列 → RPN 序列。 */
  function toRPN(tokens) {
    var out = [];
    var stack = [];
    var i;
    for (i = 0; i < tokens.length; i++) {
      var t = tokens[i];

      if (t.type === 'num') { out.push(t); continue; }
      if (t.type === 'func') { stack.push(t); continue; }
      if (t.type === 'lp') { stack.push(t); continue; }

      if (t.type === 'rp') {
        var found = false;
        while (stack.length) {
          var top = stack.pop();
          if (top.type === 'lp') { found = true; break; }
          out.push(top);
        }
        if (!found) { throw new CalcError('错误：括号不匹配'); }
        if (stack.length && stack[stack.length - 1].type === 'func') { out.push(stack.pop()); }
        continue;
      }

      /* 后缀一元：直接进输出（其操作数已就绪） */
      if (t.op === '!' || t.op === '%') { out.push(t); continue; }
      /* 一元负号：入栈 */
      if (t.op === 'u-') { stack.push(t); continue; }

      /* 二元运算符 */
      var cur = BIN[t.op];
      while (stack.length) {
        var tp = stack[stack.length - 1];
        if (tp.type === 'lp') { break; }
        if (tp.type === 'func') { out.push(stack.pop()); continue; }
        var pp = opPrec(tp.op);
        if (pp > cur.p || (pp === cur.p && cur.a === 'L')) { out.push(stack.pop()); }
        else { break; }
      }
      stack.push(t);
    }

    while (stack.length) {
      var rem = stack.pop();
      if (rem.type === 'lp' || rem.type === 'rp') { throw new CalcError('错误：括号不匹配'); }
      out.push(rem);
    }
    return out;
  }

  /** 当前角度制。 */
  var state = {
    expr: '',
    caret: 0,
    angle: 'DEG',
    memory: 0,
    history: [],
    lastResult: null,
    strict: false   // 按下 = 后强制显示红色错误文案（绕过「输入中」的中性提示）
  };

  function toRad(x) { return state.angle === 'DEG' ? x * Math.PI / 180 : x; }
  function fromRad(x) { return state.angle === 'DEG' ? x * 180 / Math.PI : x; }

  /** 阶乘：仅支持 0~170 的整数。 */
  function factorial(x) {
    if (typeof x !== 'number' || !isFinite(x) || x < 0 || Math.floor(x) !== x || x > 170) {
      throw new CalcError('错误：阶乘仅支持 0~170 的整数');
    }
    var r = 1;
    for (var i = 2; i <= x; i++) { r *= i; }
    return r;
  }

  /** 一元函数求值（含定义域校验与「未定义」判定）。 */
  function applyFunc(name, x) {
    switch (name) {
      case 'sin': return Math.sin(toRad(x));
      case 'cos': return Math.cos(toRad(x));
      case 'tan':
        if (state.angle === 'DEG') {
          if ((x - 90) % 180 === 0) { throw new CalcError('未定义'); }
        } else if (Math.abs(Math.cos(x)) < 1e-12) {
          throw new CalcError('未定义');
        }
        return Math.tan(toRad(x));
      case 'asin':
        if (x < -1 || x > 1) { throw new CalcError('无效输入'); }
        return fromRad(Math.asin(x));
      case 'acos':
        if (x < -1 || x > 1) { throw new CalcError('无效输入'); }
        return fromRad(Math.acos(x));
      case 'atan': return fromRad(Math.atan(x));
      case 'ln':
        if (!(x > 0)) { throw new CalcError('无效输入'); }
        return Math.log(x);
      case 'log':
        if (!(x > 0)) { throw new CalcError('无效输入'); }
        return Math.log10 ? Math.log10(x) : Math.log(x) / Math.LN10;
      case 'sqrt':
        if (x < 0) { throw new CalcError('无效输入'); }
        return Math.sqrt(x);
      case 'abs': return Math.abs(x);
      case 'exp':
        var ev = Math.exp(x);
        if (isNaN(ev)) { throw new CalcError('无效输入'); }
        if (!isFinite(ev)) { throw new CalcError('错误：数值溢出'); }
        return ev;
      default: throw new CalcError('错误：表达式格式有误');
    }
  }

  /** 二元运算求值（含除以 0 / 幂域错误）。 */
  function binaryOp(op, a, b) {
    switch (op) {
      case '+': return a + b;
      case '-': return a - b;
      case '*': return a * b;
      case '/':
        if (b === 0) { throw new CalcError('错误：除数不能为 0'); }
        return a / b;
      case '^':
        if (a === 0 && b < 0) { throw new CalcError('错误：除数不能为 0'); } // 0^-1 归为除以 0
        var r = Math.pow(a, b);
        if (isNaN(r)) { throw new CalcError('无效输入'); }        // 如 (-8)^0.5：不是实数
        if (!isFinite(r)) { throw new CalcError('错误：数值溢出'); } // 如 9^9^9：越界
        return r;
      default: throw new CalcError('错误：表达式格式有误');
    }
  }

  /** RPN 求值。 */
  function evalRPN(rpn) {
    var st = [];
    var i;
    for (i = 0; i < rpn.length; i++) {
      var t = rpn[i];
      if (t.type === 'num') { st.push(t.value); continue; }

      if (t.type === 'func') {
        if (st.length < 1) { throw new CalcError('错误：表达式格式有误'); }
        st.push(applyFunc(t.name, st.pop()));
        continue;
      }

      if (t.op === 'u-') {
        if (st.length < 1) { throw new CalcError('错误：表达式格式有误'); }
        st.push(-st.pop());
        continue;
      }
      if (t.op === '!') {
        if (st.length < 1) { throw new CalcError('错误：表达式格式有误'); }
        st.push(factorial(st.pop()));
        continue;
      }
      if (t.op === '%') {
        if (st.length < 1) { throw new CalcError('错误：表达式格式有误'); }
        st.push(st.pop() / 100);
        continue;
      }

      if (st.length < 2) { throw new CalcError('错误：表达式格式有误'); }
      var b = st.pop();
      var a = st.pop();
      st.push(binaryOp(t.op, a, b));
    }
    if (st.length !== 1) { throw new CalcError('错误：表达式格式有误'); }
    return st[0];
  }

  /** 格式化：非有限值返回 null；否则按 12 位有效数字输出。 */
  function clean(x) {
    if (typeof x !== 'number' || !isFinite(x)) { return null; }
    var v = x;
    if (Math.abs(v) < 1e-13) { v = 0; }                 // 消除 -0 与极小噪声
    var y = Number(v.toPrecision(12));                  // 四舍五入到 12 位有效数字
    if (Math.abs(y) >= 1e16 || (y !== 0 && Math.abs(y) < 1e-9)) {
      return y.toExponential(11);                       // 科学计数法：12 位有效数字
    }
    return String(y);                                   // 常规十进制，天然无多余尾零
  }

  /** 把 aEb 形式的显示串展开成纯十进制串（便于再次插入表达式，因 tokenizer 以 e 为常量）。 */
  function sciToPlain(s) {
    var m = /^(-?)(\d)(?:\.(\d+))?e([+-]?\d+)$/i.exec(String(s));
    if (!m) { return String(s); }
    var sign = m[1];
    var intd = m[2];
    var frac = m[3] || '';
    var exp = parseInt(m[4], 10);
    var digits = intd + frac;
    var pointPos = 1 + exp;
    var intPart;
    var fracPart;
    if (pointPos <= 0) {
      intPart = '0';
      fracPart = repeat('0', -pointPos) + digits;
    } else if (pointPos >= digits.length) {
      intPart = digits + repeat('0', pointPos - digits.length);
      fracPart = '';
    } else {
      intPart = digits.slice(0, pointPos);
      fracPart = digits.slice(pointPos);
    }
    return sign + intPart + (fracPart ? '.' + fracPart : '');
  }

  function repeat(ch, n) {
    var s = '';
    for (var i = 0; i < n; i++) { s += ch; }
    return s;
  }

  /** 数字 → 可安全插入表达式的字符串（科学计数法会被展开）。 */
  function toInputStr(x) {
    var d = clean(x);
    if (d === null) { return null; }
    if (d.indexOf('e') === -1 && d.indexOf('E') === -1) { return d; }
    return sciToPlain(d);
  }

  /** 求值当前表达式：{ok:true,value,text} 或 {ok:false,error}。 */
  function evalCurrent() {
    try {
      var tokens = tokenize(state.expr);
      if (!tokens.length) { return { ok: false, error: '错误：表达式格式有误' }; }
      var rpn = toRPN(tokens);
      var v = evalRPN(rpn);
      var text = clean(v);
      if (text === null) {
        /* 语法合法但结果非有限：NaN 视为无效输入，±Infinity 视为数值溢出 */
        return { ok: false, error: isNaN(v) ? '无效输入' : '错误：数值溢出' };
      }
      return { ok: true, value: Number(text), text: text };
    } catch (err) {
      if (err instanceof CalcError) { return { ok: false, error: err.message }; }
      return { ok: false, error: '错误：表达式格式有误' };
    }
  }

  /* =====================================================================
     二、界面渲染
     ===================================================================== */

  function $(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /** 仅渲染层把 * → ×、/ → ÷（内部始终保存 ASCII）。 */
  function displayExpr(s) {
    return String(s).replace(/\*/g, '\u00d7').replace(/\//g, '\u00f7');
  }

  function renderExprLine() {
    var el = $('exprLine');
    if (state.expr === '') {
      el.classList.add('empty');
      el.innerHTML = '<span class="caret"></span>';
      return;
    }
    el.classList.remove('empty');
    var disp = displayExpr(state.expr);
    var c = Math.max(0, Math.min(state.caret, disp.length));
    el.innerHTML = esc(disp.slice(0, c)) + '<span class="caret"></span>' + esc(disp.slice(c));
  }

  /** 表达式是否处于「输入尚未完成」状态：末尾是待补的运算符/左括号，或左括号多于右括号。 */
  function isIncomplete() {
    var s = state.expr.replace(/\s+$/, '');
    if (s === '') { return true; }
    var last = s.charAt(s.length - 1);
    if (last === '+' || last === '-' || last === '*' || last === '/' ||
        last === '^' || last === '%' || last === '!' || last === '(') { return true; }
    var open = 0;
    var close = 0;
    for (var i = 0; i < s.length; i++) {
      if (s.charAt(i) === '(') { open++; } else if (s.charAt(i) === ')') { close++; }
    }
    return open > close;
  }

  function renderPreview() {
    var el = $('previewLine');
    if (state.expr === '') {
      el.textContent = '';
      el.classList.remove('err');
      return;
    }
    var r = evalCurrent();
    if (r.ok) { el.textContent = r.text; el.classList.remove('err'); return; }
    /* 解析失败时：仍在输入中 → 灰色中性提示；确属有误（或按下 = 强制）→ 红色错误文案 */
    if (!state.strict && isIncomplete()) {
      el.textContent = '\u2026';
      el.classList.remove('err');
      return;
    }
    el.textContent = r.error;
    el.classList.add('err');
  }

  function memDisplay() {
    var d = clean(state.memory);
    return d === null ? '0' : d;
  }

  function renderStatus() {
    $('angleBadge').textContent = state.angle;
    $('memBadge').hidden = !(state.memory !== 0);
    $('memVal').textContent = memDisplay();
  }

  function syncAngleUI() {
    var btns = $('angleSeg').querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute('aria-pressed', String(btns[i].getAttribute('data-angle') === state.angle));
    }
    $('angleBadge').textContent = state.angle;
  }

  function renderHistory() {
    var host = $('histList');
    if (!state.history.length) {
      host.innerHTML = '<div class="hist-empty">暂无历史记录<br>按下 = 求值后会记录在这里</div>';
      return;
    }
    var html = '';
    for (var i = state.history.length - 1; i >= 0; i--) {
      var it = state.history[i];
      html +=
        '<div class="hist-item">' +
          '<button type="button" class="hist-expr" data-hist-expr="' + i + '" ' +
            'aria-label="回填表达式 ' + esc(it.expr) + '">' + esc(displayExpr(it.expr)) + '</button>' +
          '<button type="button" class="hist-res" data-hist-res="' + i + '" ' +
            'aria-label="插入结果 ' + esc(it.res) + '">= ' + esc(it.res) + '</button>' +
        '</div>';
    }
    host.innerHTML = html;
  }

  function refresh() {
    renderExprLine();
    renderPreview();
    renderStatus();
  }

  /* =====================================================================
     三、交互
     ===================================================================== */

  var toastTimer = null;
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    if (toastTimer) { clearTimeout(toastTimer); }
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1600);
  }

  function insert(text) {
    if (!text) { return; }
    var c = Math.max(0, Math.min(state.caret, state.expr.length));
    state.expr = state.expr.slice(0, c) + text + state.expr.slice(c);
    state.caret = c + String(text).length;
    state.strict = false;
    refresh();
  }

  function doClear() {
    state.expr = '';
    state.caret = 0;
    state.lastResult = null;
    state.strict = false;
    refresh();
  }

  function doBackspace() {
    if (state.caret > 0) {
      state.expr = state.expr.slice(0, state.caret - 1) + state.expr.slice(state.caret);
      state.caret -= 1;
      state.strict = false;
      refresh();
    }
  }

  function doDeleteForward() {
    if (state.caret < state.expr.length) {
      state.expr = state.expr.slice(0, state.caret) + state.expr.slice(state.caret + 1);
      state.strict = false;
      refresh();
    }
  }

  function moveCaret(delta) {
    var c = state.caret + delta;
    if (c < 0) { c = 0; }
    if (c > state.expr.length) { c = state.expr.length; }
    state.caret = c;
    renderExprLine();
  }

  function pushHistory(expr, res) {
    var last = state.history[state.history.length - 1];
    if (last && last.expr === expr && last.res === res) {
      renderHistory();
      return;
    }
    state.history.push({ expr: expr, res: res });
    if (state.history.length > 20) { state.history = state.history.slice(-20); }
    saveState();
    renderHistory();
  }

  function doEquals() {
    if (state.expr === '') { return; } // 空表达式：不做任何事、不报错
    var r = evalCurrent();
    state.strict = !r.ok;   // 按下 = 时即使「输入中」也要显示红色错误文案
    if (r.ok) {
      state.lastResult = r.text;
      pushHistory(state.expr, r.text);
      toast('= ' + r.text);
    } else {
      state.lastResult = null;
    }
    refresh();
  }

  /** 当前可取用的「预览值」，无有效结果时返回 null。 */
  function currentValue() {
    if (state.expr === '') { return null; }
    var r = evalCurrent();
    return r.ok ? r.value : null;
  }

  function currentValueText() {
    if (state.expr === '') { return null; }
    var r = evalCurrent();
    return r.ok ? r.text : null;
  }

  function memAction(kind) {
    if (kind === 'add' || kind === 'sub') {
      var v = currentValue();
      if (v === null) { toast('当前没有可取用的结果'); return; }
      state.memory += (kind === 'add' ? v : -v);
      state.memory = Number(clean(state.memory) === null ? '0' : clean(state.memory));
      toast('M = ' + memDisplay());
    } else if (kind === 'recall') {
      var s = toInputStr(state.memory);
      insert(s === null ? '0' : s);
    } else if (kind === 'clear') {
      state.memory = 0;
      toast('记忆已清除');
    }
    saveState();
    renderStatus();
  }

  /** 复制结果：clipboard → execCommand → 提示手动复制（任何失败都不崩溃）。 */
  function copyResult() {
    var text = currentValueText();
    if (text === null) { toast('暂无结果可复制'); return; }
    var fallback = function () { legacyCopy(text); };
    try {
      if (window.navigator && window.navigator.clipboard && window.navigator.clipboard.writeText) {
        window.navigator.clipboard.writeText(text).then(function () {
          toast('已复制：' + text);
        }, fallback);
      } else {
        fallback();
      }
    } catch (e) {
      fallback();
    }
  }

  function legacyCopy(text) {
    var ok = false;
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', 'readonly');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ok = !!(document.execCommand && document.execCommand('copy'));
      document.body.removeChild(ta);
    } catch (e) {
      ok = false;
    }
    toast(ok ? '已复制：' + text : '请手动复制');
  }

  /* =====================================================================
     四、持久化（localStorage 可能抛异常，必须 try/catch 包裹）
     ===================================================================== */

  var LS_KEY = 'toolbox.calc.v1';

  function loadState() {
    try {
      var raw = window.localStorage.getItem(LS_KEY);
      if (!raw) { return; }
      var o = JSON.parse(raw);
      if (!o || typeof o !== 'object') { return; }
      if (Object.prototype.toString.call(o.history) === '[object Array]') {
        var list = [];
        for (var i = 0; i < o.history.length; i++) {
          var it = o.history[i];
          if (it && typeof it.expr === 'string' && typeof it.res === 'string') {
            list.push({ expr: it.expr, res: it.res });
          }
        }
        state.history = list.slice(-20);
      }
      if (typeof o.memory === 'number' && isFinite(o.memory)) { state.memory = o.memory; }
      if (o.angle === 'DEG' || o.angle === 'RAD') { state.angle = o.angle; }
    } catch (e) { /* file:// 或隐私模式：静默降级为内存态 */ }
  }

  function saveState() {
    try {
      window.localStorage.setItem(LS_KEY, JSON.stringify({
        history: state.history,
        memory: state.memory,
        angle: state.angle
      }));
    } catch (e) { /* 同上：不可用则忽略 */ }
  }

  /* =====================================================================
     五、事件绑定
     ===================================================================== */

  function handlePadClick(e) {
    var b = e.target && e.target.closest ? e.target.closest('button') : null;
    if (!b) { return; }
    var ins = b.getAttribute('data-ins');
    if (ins !== null) { insert(ins); return; }
    var act = b.getAttribute('data-act');
    if (act === 'clear') { doClear(); }
    else if (act === 'del') { doBackspace(); }
    else if (act === 'negate') { insert('-'); }
    else if (act === 'equals') { doEquals(); }
  }

  function bindEvents() {
    var pads = document.querySelector('.pads');
    if (pads) { pads.addEventListener('click', handlePadClick); }

    $('angleSeg').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-angle]');
      if (!b) { return; }
      state.angle = b.getAttribute('data-angle');
      syncAngleUI();
      saveState();
      refresh();
    });

    $('histList').addEventListener('click', function (e) {
      var be = e.target.closest('button[data-hist-expr]');
      if (be) {
        var idx = parseInt(be.getAttribute('data-hist-expr'), 10);
        var item = state.history[idx];
        if (item) {
          state.expr = item.expr;
          state.caret = state.expr.length;
          state.strict = false;
          refresh();
        }
        return;
      }
      var br = e.target.closest('button[data-hist-res]');
      if (br) {
        var idx2 = parseInt(br.getAttribute('data-hist-res'), 10);
        var item2 = state.history[idx2];
        if (item2) { insert(sciToPlain(item2.res)); }
      }
    });

    $('clearHist').addEventListener('click', function () {
      state.history = [];
      saveState();
      renderHistory();
      toast('历史已清空');
    });

    $('copyRes').addEventListener('click', copyResult);

    var memBtns = document.querySelectorAll('[data-mem]');
    for (var i = 0; i < memBtns.length; i++) {
      memBtns[i].addEventListener('click', function () {
        memAction(this.getAttribute('data-mem'));
      });
    }

    document.addEventListener('keydown', onKeyDown);
  }

  function onKeyDown(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) { return; }
    var k = e.key;

    /* 焦点在按钮上时，交给原生行为（避免 Enter/空格 触发两次） */
    var ae = document.activeElement;
    if ((k === 'Enter' || k === ' ') && ae && ae.tagName === 'BUTTON') { return; }

    if (k === 'Enter' || k === '=') { e.preventDefault(); doEquals(); return; }
    if (k === 'Backspace') { e.preventDefault(); doBackspace(); return; }
    if (k === 'Delete') { e.preventDefault(); doDeleteForward(); return; }
    if (k === 'Escape') { e.preventDefault(); doClear(); return; }
    if (k === 'ArrowLeft') { e.preventDefault(); moveCaret(-1); return; }
    if (k === 'ArrowRight') { e.preventDefault(); moveCaret(1); return; }
    if (k === 'Home') { e.preventDefault(); state.caret = 0; renderExprLine(); return; }
    if (k === 'End') { e.preventDefault(); state.caret = state.expr.length; renderExprLine(); return; }

    if (/^[0-9.]$/.test(k)) { e.preventDefault(); insert(k); return; }
    if (k === '+' || k === '-' || k === '*' || k === '/') { e.preventDefault(); insert(k); return; }
    if (k === '(' || k === ')') { e.preventDefault(); insert(k); return; }
    if (k === '^' || k === '!' || k === '%') { e.preventDefault(); insert(k); return; }
  }

  /* =====================================================================
     六、初始化
     ===================================================================== */

  loadState();
  syncAngleUI();
  renderHistory();
  state.caret = state.expr.length;
  refresh();
  bindEvents();
})();
</script>
</body>
</html>
